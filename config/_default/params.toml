author = "PythaGodzilla"
description = "PythaGodzilla的Blog，不过是一些大声的窃窃私语。"
defaultTheme = "auto"
env = "production"


showReadingTime = true
showShareButtons = false
showPostNavLinks = true
showBreadcrumbs = true
showCodeCopyButton = true
showWordCount = true
showToc = true
comments = true

homeInfoParams = { Title = "欢迎", Content = "不过是一些大声的窃窃私语。", AlignSocialIconsTo = "center" }

mainSections = ["life", "tech"]

[assets]
favicon = "/favicon/WebIcon-512x512.ico"

[fuseOpts]
isCaseSensitive = false
includeMatches = true
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "tags", "categories", "summary", "content"]
