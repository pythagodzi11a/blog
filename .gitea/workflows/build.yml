name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: https://git.pythagodzilla.top/pythagodzilla/checkout.git@v4
        with:
          submodules: true

      - name: Force Switch to China Mirror and Install Hugo
        run: |
          echo "🚀 正在强制更换 APT 国内源..."
          # 1. 针对旧格式 (sources.list)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|http://.*archive.ubuntu.com|https://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
            sudo sed -i 's|http://.*security.ubuntu.com|https://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list
          fi

          # 2. 针对新格式 (ubuntu.sources - Ubuntu 24.04+)
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://.*archive.ubuntu.com|https://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's|http://.*security.ubuntu.com|https://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/ubuntu.sources
          fi

          # 3. 执行更新并安装
          sudo apt-get update
          sudo apt-get install -y hugo

      - name: generate static files
        run: |
          # 检查版本，如果发现 apt 安装的版本太低无法构建，请考虑方案 2（自带二进制）
          hugo version
          hugo -F --cleanDestinationDir

      - name: Deploy via Native SCP
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_IP: ${{ secrets.SERVER_IP }}
        run: |
          apt-get update && apt-get install -y openssh-client sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_IP" >> ~/.ssh/known_hosts 2>/dev/null

          echo "🚀 Starting Deployment..."
          sshpass -e ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_IP" "rm -rf /var/www/blog/*"
          sshpass -e scp -o StrictHostKeyChecking=no -r public/* "$SSH_USER@$SSH_IP:/var/www/blog/"
          echo "✅ Deployment complete!"
