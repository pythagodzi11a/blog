<script>
  // 选择需要观察变动的节点
  const targetNode = document.documentElement;

  // 观察器的配置（需要观察什么变动）
  const config = { attributes: true, attributeFilter: ["data-theme"] };

  // 3. 定义回调逻辑
  const callback = function (mutationsList) {
    for (let mutation of mutationsList) {
      // 逻辑：只要属性变了，就去重新 getAttribute 取最新值
      if (mutation.attributeName === "data-theme") {
        const currentTheme = targetNode.getAttribute("data-theme");

        window.REMARK42.changeTheme(currentTheme);
      }
    }
  };

  // 创建一个观察器实例并传入回调函数
  const observer = new MutationObserver(callback);

  // 以上述配置开始观察目标节点
  observer.observe(targetNode, config);

  var remark_config = {
    host: "https://blog-comments.pythagodzilla.top",
    site_id: "remark",
    components: ["embed", "last-comments", "counter"],
    theme: document.documentElement.getAttribute("data-theme") || "light",
    locale: "zh",
    show_email_subscription: false,
    simple_view: true,
    no_footer: false,
  };
</script>

<script>
  !(function (e, n) {
    for (var o = 0; o < e.length; o++) {
      var r = n.createElement("script"),
        c = ".js",
        d = n.head || n.body;
      ("noModule" in r ? ((r.type = "module"), (c = ".mjs")) : (r.async = !0),
        (r.defer = !0),
        (r.src = remark_config.host + "/web/" + e[o] + c),
        d.appendChild(r));
    }
  })(remark_config.components || ["embed"], document);
</script>
